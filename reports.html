<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Reports</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet"
href="assets/css/animations.css">

</head>

<body class="dashboard-bg min-h-screen text-white">

<div id="sidebar"></div>

<main class="ml-72 p-8">

<!-- HEADER -->

<div
class="flex items-center justify-between mb-10">

<div>

<h1
class="text-5xl font-bold">

Reports

</h1>

<p
class="text-slate-400 mt-2">

Collection Analytics & Reports

</p>

</div>

<div
class="flex gap-4">

<button
id="exportCSV"
class="
px-5 py-3
rounded-xl
bg-green-600
hover:bg-green-700
transition">

Export CSV

</button>

<button
id="exportExcel"
class="
px-5 py-3
rounded-xl
bg-cyan-600
hover:bg-cyan-700
transition">

Export Excel

</button>

</div>

</div>

<!-- FILTERS -->

<div
class="
grid
grid-cols-1
md:grid-cols-2
gap-6
mb-8">

<div class="stat-card">

<label
class="
block
mb-2
text-slate-400">

Month

</label>

<select
id="reportMonth"
class="input-modal">

<option value="1">January</option>
<option value="2">February</option>
<option value="3">March</option>
<option value="4">April</option>
<option value="5">May</option>
<option value="6" selected>June</option>
<option value="7">July</option>
<option value="8">August</option>
<option value="9">September</option>
<option value="10">October</option>
<option value="11">November</option>
<option value="12">December</option>

</select>

</div>

<div class="stat-card">

<label
class="
block
mb-2
text-slate-400">

Year

</label>

<input
id="reportYear"
type="number"
value="2026"
class="input-modal">

</div>

</div>

<!-- KPI CARDS -->

<div
class="
grid
grid-cols-1
md:grid-cols-2
xl:grid-cols-5
gap-6">

<div class="stat-card">

<p class="text-slate-400">
Total Members
</p>

<h2
id="reportTotalMembers"
class="
text-5xl
font-bold
mt-4">

0

</h2>

</div>

<div class="stat-card">

<p class="text-slate-400">
Paid
</p>

<h2
id="reportPaidMembers"
class="
text-5xl
font-bold
mt-4">

0

</h2>

</div>

<div class="stat-card">

<p class="text-slate-400">
Partial
</p>

<h2
id="reportPartialMembers"
class="
text-5xl
font-bold
mt-4">

0

</h2>

</div>

<div class="stat-card">

<p class="text-slate-400">
Unpaid
</p>

<h2
id="reportUnpaidMembers"
class="
text-5xl
font-bold
mt-4">

0

</h2>

</div>

<div class="stat-card">

<p class="text-slate-400">
Collection
</p>

<h2
id="reportCollection"
class="
text-5xl
font-bold
mt-4">

₹0

</h2>

</div>

</div>

<!-- CHART -->

<div
class="
stat-card
mt-8">

<div
class="
flex
justify-between
items-center
mb-6">

<h2
class="
text-xl
font-semibold">

Monthly Collection Report

</h2>

<span
id="reportPeriod"
class="text-slate-400">

2026

</span>

</div>

<div
style="
height:350px">

<canvas
id="reportsChart">
</canvas>

</div>

</div>

<!-- REPORT TABLE -->

<div
class="
stat-card
mt-8">

<h2
class="
text-xl
font-semibold
mb-6">

Payment Report

</h2>

<div
class="overflow-x-auto">

<table
class="w-full">

<thead>

<tr
class="
border-b
border-white/10">

<th
class="
text-left
py-4">

Member

</th>

<th
class="
text-left
py-4">

Flat

</th>

<th
class="
text-left
py-4">

Amount

</th>

<th
class="
text-left
py-4">

Status

</th>

<th
class="
text-left
py-4">

Date

</th>

</tr>

</thead>

<tbody
id="reportsTable">

</tbody>

</table>

</div>

</div>

</main>

<script type="module">

import "./assets/js/auth/authGuard.js";

import {
renderSidebar
}
from "./assets/js/components/sidebar.js";

document
.getElementById(
"sidebar"
)
.innerHTML =
renderSidebar();

</script>

<!-- SheetJS Excel Library -->

<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>

<script
type="module"
src="assets/js/reports/reports.js">
</script>

</body>

</html>
